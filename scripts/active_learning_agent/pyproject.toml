[project]
name = "active-learning-agent"
version = "0.1.0"
description = "Epistemic foraging agent experiments"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "datasets>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=1.3.0",
    "requests>=2.25.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.41.0",
]

[tool.setuptools]
py-modules = ["forage", "eval_browsecomp", "eval_simpleqa"]
